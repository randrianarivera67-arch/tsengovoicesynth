name: Build VST3 - Tsengo Voice Synth
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone JUCE
        run: git clone --depth 1 --branch 7.0.9 https://github.com/juce-framework/JUCE.git JUCE
      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: TsengoVoiceSynth-VST3-Windows
          path: build/**/*.vst3
          if-no-files-found: warn
