name: Build VST3 - Tsengo Voice Synth v3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TsengoVoiceSynth-v3-Windows
          path: build/**/*.vst3
          if-no-files-found: warn
