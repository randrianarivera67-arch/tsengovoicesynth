name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build-tests -DTSENGO_TESTS_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-tests --parallel 4
      - run: ctest --test-dir build-tests --output-on-failure

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show available Visual Studio
        shell: bash
        run: |
          "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' || true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p artifact
          # -mindepth 4 skips the nested copy inside each bundle
          find build -maxdepth 5 -name "*.vst3" -type d -print0 | while IFS= read -r -d '' p; do
            echo "vst3: $p"; cp -r "$p" artifact/
          done
          find build -path "*Standalone*" -name "*.exe" -type f -print0 | while IFS= read -r -d '' p; do
            echo "app: $p"; cp "$p" artifact/
          done
          ls -R artifact

      - name: Build installer
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" Installer\TsengoVoice.iss

      - name: Show installer
        shell: bash
        run: ls -lh Output

      - uses: actions/upload-artifact@v4
        with:
          name: TsengoVoice-Installer
          path: Output/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: TsengoVoice-Windows
          path: artifact/
